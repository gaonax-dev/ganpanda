[package]
name = "ganpanda"
version = "0.1.0"
description = "간판다 — 건물 사진 위에서 사인물을 함께 정하고 견적까지"
authors = ["가오낙스"]
license = ""
repository = "https://github.com/gaonax-dev/ganpanda"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ganpanda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# iOS 26 시뮬레이터 크래시 우회 (patches/tauri-runtime-wry 의 한 줄, docs/dev/app.md)
[patch.crates-io]
tauri-runtime-wry = { path = "patches/tauri-runtime-wry" }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# 외부 링크·앱 스킴(tel:·카카오톡·카드사 앱)을 시스템에 넘긴다 (2026-10-24 데스크톱·모바일 앱 D1)
tauri-plugin-opener = "2"
# ganpanda:// 딥링크 — 시스템 브라우저의 카카오(톡 앱) 로그인이 끝나면 앱으로 돌아온다 (2026-10-24)
tauri-plugin-deep-link = "2"
url = "2"
